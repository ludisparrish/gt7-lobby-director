<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ФАЛ LMF — Судейский Координационный Центр</title>
    <style>
        /* Базовые гоночные настройки фона */
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Главная неоновая красная рамка по центру экрана */
        .launcher-card {
            background-color: #111111;
            border: 3px solid #ff1a1a;
            border-radius: 12px;
            padding: 40px 35px;
            width: 440px;
            box-shadow: 0 0 25px rgba(255, 26, 26, 0.25);
            text-align: center;
            box-sizing: border-box;
        }

        /* Текстовые блоки логотипа лиги */
        .main-title {
            font-family: 'Arial Black', sans-serif;
            font-size: 26px;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .title-white { color: #ffffff; }
        .title-red { color: #ff1a1a; }
        
        .sub-title {
            color: #777777;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        /* Живой счетчик подключенных пилотов */
        .pilots-counter-box {
            background-color: #090909;
            border: 1px solid #222222;
            border-radius: 6px;
            padding: 14px;
            font-family: 'Arial Black', sans-serif;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }
        .counter-value {
            color: #00ffff; /* Бирюзовое неоновое число пилотов */
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
            margin-left: 5px;
        }

        /* Стили больших навигационных кнопок */
        .menu-btn {
            display: block;
            width: 100%;
            padding: 16px;
            font-family: 'Arial Black', sans-serif;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 15px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        
        .btn-admin {
            background-color: #ff1a1a;
            color: white;
        }
        .btn-admin:hover {
            background-color: #cc0000;
            box-shadow: 0 0 12px rgba(255, 26, 26, 0.4);
        }

        .btn-overlay {
            background-color: #ff7700;
            color: white;
            margin-bottom: 0;
        }
        .btn-overlay:hover {
            background-color: #cc5200;
            box-shadow: 0 0 12px rgba(255, 119, 0, 0.4);
        }

        /* Подвал карточки */
        .footer-text {
            color: #333333;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1.5px;
            margin-top: 35px;
        }
    </style>
</head>
<body>

    <div class="launcher-card">
        <!-- КИБЕРСПОРТИВНЫЙ ЛОГОТИП ФАЛ -->
        <div class="main-title">
            <span class="title-white">ФАЛ</span> <span class="title-red">LMF</span>
        </div>
        <div class="sub-title">Судейский координационный центр<br>гоночной лиги</div>

        <!-- ЖИВОЙ СЧЕТЧИК ПАКЕТОВ -->
        <div class="pilots-counter-box">
            Connected Pilots: <span id="pilots-count" class="counter-value">0</span>
        </div>

        <!-- КНОПКИ ПЕРЕХОДА -->
        <a href="/admin" class="menu-btn btn-admin">Админка</a>
        <a href="/overlay" class="menu-btn btn-overlay">Оверлей</a>

        <div class="footer-text">SRO Systems Active</div>
    </div>
    <script>
        // Функция автоматического подсчета активных пилотов на главной странице
        async function updateConnectedPilotsCounter() {
            try {
                // Запрашиваем чистый JSON сессии с сервера
                let res = await fetch('/api/data?t=' + Date.now());
                if (!res.ok) return;
                let data = await res.json();
                
                let counterElement = document.getElementById('pilots-count');
                
                // Если массив пилотов существует, выводим его длину, иначе жестко держим 0
                if (data && data.pilots) {
                    counterElement.innerText = data.pilots.length;
                } else {
                    counterElement.innerText = "0";
                }
            } catch (err) {
                console.error("Сбой обновления счетчика пилотов главной страницы:", err);
            }
        }

        // Опрашиваем бэкенд раз в секунду (частота 1000мс) для живого неонового счетчика
        setInterval(updateConnectedPilotsCounter, 1000);
        
        // Первый запуск скрипта при загрузке страницы в браузере
        window.onload = updateConnectedPilotsCounter;
    </script>
</body>
</html>

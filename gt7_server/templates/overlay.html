<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SRO GT7 Stream Overlay</title>
    <!-- Подтягиваем наши изолированные CSS стили -->
    <link rel="stylesheet" href="/static/overlay.css">
</head>
<body>

    <div class="hud-wrapper">
        <!-- СТАТУСНАЯ ШАПКА ТРЕКА -->
        <div class="hud-header">
            <div class="track-name" id="track-display">--</div>
            <div class="laps-counter" id="laps-display">PRACTICE</div>
        </div>

        <!-- ТУРНИРНАЯ СЕТКА ПИЛОТОВ -->
        <div class="leaderboard" id="leaderboard-grid"></div>

        <!-- 👑 ШАБЛОН ГРАДИЕНТНОЙ ПЛАШКИ [ЛК] (Изначально пустая, собирается внутри JS модуля) -->
        <div class="fastest-lap-card" id="fl-card-block"></div>
    </div>

    <!-- 🔥 МОЩНЫЙ СУДЕЙСКИЙ ФИКС КЭША: Врезаем динамический таймстамп прямо в ссылку подключения модуля! -->
    <script>
        document.write('<script src="/static/overlay.js?v=' + Date.now() + '"><\/script>');
    </script>
</body>
</html>

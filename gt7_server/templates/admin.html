<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SRO — Судейский Координационный Центр</title>
    <style>
        /* Базовые гоночные настройки экрана */
        body { 
            background-color: #111111; 
            color: #ffffff; 
            font-family: 'Arial', sans-serif; 
            margin: 0; 
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        
        /* Разделение экрана на две равные панели */
        .split-container {
            display: flex;
            gap: 20px;
            height: calc(100vh - 40px);
            width: 100%;
        }
        
        /* ЛЕВАЯ ЧАСТЬ: Пульт управления Судьи */
        .admin-panel { 
            width: 45%; 
            min-width: 460px;
            background-color: #151515; 
            padding: 25px; 
            border-radius: 8px; 
            border: 1px solid #222222; 
            box-shadow: 0 4px 25px rgba(0,0,0,0.8); 
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }
        
        /* ПРАВАЯ ЧАСТЬ: Мониторинг живого стрим-оверлея */
        .overlay-preview-panel {
            flex-grow: 1;
            background-color: #111111;
            border-radius: 8px;
            border: 2px dashed #333333;
            height: 100%;
        }
        .overlay-iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 6px;
            background-color: transparent;
        }

        .main-header { 
            color: #00ffff; 
            text-align: center; 
            margin-top: 0; 
            margin-bottom: 5px;
            font-family: 'Arial Black', sans-serif; 
            letter-spacing: 1px; 
            text-transform: uppercase; 
            font-size: 22px;
        }
        
        /* Кастомные неоновые рамки блоков */
        .neo-box { 
            border-radius: 8px; 
            padding: 15px; 
            background-color: #1a1a1a; 
        }
        .box-blue { border: 2px solid #00ffff; box-shadow: 0 0 15px rgba(0,255,255,0.12); }
        .box-yellow { border: 2px solid #ffcc00; box-shadow: 0 0 15px rgba(255,204,0,0.12); }
        .box-purple { border: 2px solid #8a2be2; box-shadow: 0 0 15px rgba(138,43,226,0.12); }

        .section-title { 
            font-weight: bold; 
            margin-bottom: 12px; 
            font-size: 13px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            font-family: 'Arial Black', sans-serif;
        }
        .title-blue { color: #00ffff; }
        .title-yellow { color: #ffcc00; }
        .title-purple { color: #a14fff; }
        
        /* Поля ввода параметров этапа */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
        }
        .input-group label { font-size: 12px; color: #888888; text-transform: uppercase; font-weight: bold; }
        .neo-input {
            background-color: #222222;
            border: 1px solid #444444;
            border-radius: 4px;
            padding: 10px;
            color: white;
            font-size: 14px;
            font-weight: bold;
        }
        .neo-input:focus { border-color: #00ffff; outline: none; }

        .buttons-container { display: flex; gap: 10px; width: 100%; }
        
        /* Кнопки переключения режимов */
        .btn-mode { 
            flex: 1; 
            background-color: #222222; 
            border: 2px solid #333333; 
            border-radius: 6px; 
            padding: 12px 5px; 
            color: #888888; 
            font-weight: bold; 
            font-size: 12px; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: all 0.2s; 
        }

        /* Кнопки флагов Safety Car */
        .btn-sc { 
            flex: 1; 
            padding: 12px 5px; 
            font-weight: bold; 
            font-size: 12px;
            border-radius: 6px; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: all 0.2s;
            color: white;
            border: 2px solid transparent;
        }
        .btn-purple-action {
            width: 100%;
            background-color: #221133;
            border: 2px solid #8a2be2;
            color: #a14fff;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 13px;
            transition: all 0.2s;
        }
        .btn-purple-action:hover { background-color: #8a2be2; color: white; box-shadow: 0 0 10px rgba(138,43,226,0.4); }
    </style>
</head>
<body>

    <div class="split-container">
        
        <!-- ==================== ЛЕВАЯ ЧАСТЬ: ВСЕ ПАНЕЛИ СУДЬИ ==================== -->
        <div class="admin-panel">
            <div class="main-header">⏱️ РЕЖИМ СЕССИИ</div>
            
            <!-- ⚙️ НАСТРОЙКИ ЭТАПА ЛИГИ -->
            <div class="neo-box box-blue" style="padding-bottom: 5px;">
                <div class="section-title title-blue">⚙️ НАСТРОЙКИ ЭТАПА ЛИГИ:</div>
                <div class="input-group">
                    <label>📍 Название гоночного трека:</label>
                    <input type="text" id="track-name-input" class="neo-input" placeholder="Введите трек...">
                </div>
                <div class="input-group">
                    <label>🏁 Общее количество кругов гонки:</label>
                    <input type="number" id="total-laps-input" class="neo-input" placeholder="Введите круги..." min="1">
                </div>
                <button onclick="saveTrackSettings()" class="btn-mode" style="width:100%; margin-top:5px; border-color:#00ffff; color:#00ffff; background-color:#112222;">💾 Сохранить параметры трека</button>
            </div>
            
            <!-- 📦 ВЫБОР РЕЖИМА ЭТАПА -->
            <div class="neo-box box-blue">
                <div class="section-title title-blue">📦 ВЫБОР РЕЖИМА ЭТАПА:</div>
                <div class="buttons-container">
                    <button onclick="setSessionMode('PRACTICE')" id="btn-practice" class="btn-mode">ПРАКТИКА</button>
                    <button onclick="setSessionMode('QUALIFY')" id="btn-qualify" class="btn-mode">КВАЛИФИКАЦИЯ</button>
                    <button onclick="setSessionMode('RACE')" id="btn-race" class="btn-mode">ГОНКА</button>
                </div>
            </div>

            <!-- ⚠️ УПРАВЛЕНИЕ SAFETY CAR -->
            <div class="neo-box box-yellow">
                <div class="section-title title-yellow">⚠️ УПРАВЛЕНИЕ SAFETY CAR (RACE CONTROL):</div>
                <div class="buttons-container">
                    <button onclick="setSafetyCar('ON')" id="sc-on" class="btn-sc" style="background-color: #cc9900; border-color: #ffcc00; color: white;">⚠️ SC ON</button>
                    <button onclick="setSafetyCar('CLEAR')" id="sc-clear" class="btn-sc" style="background-color: #2b8a3e; border-color: #55ff55; color: white;">🟢 CLEAR</button>
                    <button onclick="setSafetyCar('OFF')" id="sc-off" class="btn-sc" style="background-color: #222222; border-color: #333333; color: #888888;">⚪️ OFF</button>
                </div>
            </div>

            <!-- 🟪 ОЧИСТКА ТЕКУЩЕГО ЛОББИ -->
            <div class="neo-box box-purple">
                <div class="section-title title-purple">🧹 ОЧИСТКА ТЕКУЩЕГО ЛОББИ:</div>
                <button onclick="resetAllSessionTimes()" class="btn-purple-action">⚡ СБРОСИТЬ ВСЕ ВРЕМЕНА СЕССИИ</button>
            </div>
        </div>
